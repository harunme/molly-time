# Apply after obtaining the certificate; Compose >= 2.24.4 is required.
services:
  mollytime-server:
    ports: !reset []
    environment:
      # Only the internal Docker network can reach this backend.
      FORWARDED_ALLOW_IPS: "*"
  mollytime-tls:
    image: ${MOLLYTIME_NGINX_IMAGE:-nginx:1.28-bookworm}
    container_name: mollytime-tls
    restart: unless-stopped
    depends_on:
      mollytime-server:
        condition: service_healthy
    ports:
      - "${MOLLYTIME_TLS_BIND:-0.0.0.0:8096}:8096"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ../tls:/etc/nginx/tls:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--insecure", "--fail", "--silent", "https://127.0.0.1:8096/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
