server {
    listen 8096 ssl;
    server_name 118.89.122.66;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MollyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 12m;
    # Redirect existing bookmarks on the same port to HTTPS.
    error_page 497 =308 https://118.89.122.66:8096$request_uri;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $molly_backend http://mollytime-server:8096;
        proxy_pass $molly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ ^/api/manage/operations/client-releases/uploads/[a-f0-9]{32}$ {
        client_max_body_size 512m;
        set $molly_backend http://mollytime-server:8096;
        proxy_pass $molly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
