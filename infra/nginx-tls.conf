# Compatibility endpoint for TV clients still configured with the former IP.
# Application and client release requests use Seoul/MySQL and its OSS-backed APKs.
map $http_origin $molly_upstream_origin {
    default $http_origin;
    "https://118.89.122.66:8096" "https://mollytime.app";
}

server {
    listen 8096 ssl;
    server_name 118.89.122.66;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MollyTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 12m;
    error_page 497 =308 https://118.89.122.66:8096$request_uri;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_pass https://mollytime.app;
        proxy_ssl_server_name on;
        proxy_ssl_name mollytime.app;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host mollytime.app;
        proxy_set_header Origin $molly_upstream_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ "^/api/manage/operations/client-releases/uploads/[a-f0-9]{32}$" {
        client_max_body_size 512m;
        proxy_pass https://mollytime.app;
        proxy_ssl_server_name on;
        proxy_ssl_name mollytime.app;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host mollytime.app;
        proxy_set_header Origin $molly_upstream_origin;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}
