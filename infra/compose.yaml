# Local-only composition for MollyTime.
#
# - mollytime-server: MollyTime API and the independently built TV webpage.
# - admin-tools: ephemeral sidecar used to initialise the database and create an admin.
#
# State and uploaded media live under .local/.

services:
  mollytime-server:
    image: mollytime-server:local
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    container_name: mollytime-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      MOLLYTIME_DATA_DIR: /data
      MOLLYTIME_LISTEN_HOST: 0.0.0.0
      MOLLYTIME_LISTEN_PORT: "8096"
      MOLLYTIME_STORAGE_BACKEND: "local"
      MOLLYTIME_MEDIA_DIR: /media
      MOLLYTIME_PUBLIC_BASE_URL: "${MOLLYTIME_PUBLIC_BASE_URL:-}"
    volumes:
      - ../.local/molly-server:/data
      - ../.local/molly-server/media:/media/managed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/healthz', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-tools:
    image: mollytime-server:local
    profiles: ["tools"]      # opt-in: `docker compose --profile tools run --rm admin-tools …`
    working_dir: /app
    environment:
      MOLLYTIME_DATA_DIR: /data
      MOLLYTIME_MEDIA_DIR: /media
    volumes:
      - ../.local/molly-server:/data
      - ../.local/molly-server/media:/media/managed
      - ../apps/server:/app:ro
    entrypoint: ["python", "-m", "mollytime_server.scripts"]
    command: ["--help"]
