<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MollyTime · 动态 Logo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#211F1B;color:#FAFAF4;font:16px system-ui;display:grid;place-items:center}main{width:min(90vw,640px);text-align:center}.stage{height:min(66vh,520px);display:grid;place-items:center}.stage svg{width:min(100%,420px);overflow:visible}h1{font-size:24px;letter-spacing:-.5px;margin:0 0 12px}p{color:#B8B1A3;font-size:14px}button{font:inherit;cursor:pointer;padding:10px 20px;border:1px solid #5B5447;border-radius:99px;background:transparent;color:inherit;margin:8px}button:first-child{background:#F8DE7E;color:#3F3A32;border-color:transparent}input{width:min(90%,360px);accent-color:#F8DE7E;margin-top:16px}</style><main><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -48 352 352" role="img" aria-labelledby="motion-title"><title id="motion-title">MollyTime — 茉莉花轻轻绽放</title><style>

</style><g class="molly-mark" fill="#F8DE7E"><g transform="translate(120 130) scale(1.02) translate(-128 -128)"><g class="molly-pose"><g class="molly-m"><path d="M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V151C212 143 194 149 183 163V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z"/></g><g class="molly-flower"><path fill-rule="evenodd" d="M201.517 166.701A14 14 0 0 1 228.326 172.399A14 14 0 0 1 231.191 199.658A14 14 0 0 1 206.153 210.806A14 14 0 0 1 187.813 190.437A14 14 0 0 1 201.517 166.701Z"/></g></g></g></g></svg></div><h1>MollyTime</h1><p>轻轻绽放 · 安静陪伴</p><div><button id="replay">重新播放</button><button id="theme">切换背景</button><button id="pause">暂停</button></div><input aria-label="动画进度" type="range" min="0" max="1800" value="0" step="1"></main><script>const mark=document.querySelector('svg'),range=document.querySelector('input');let paused=false,light=false;const animations=()=>mark.getAnimations({subtree:true});document.querySelector('#replay').onclick=()=>{animations().forEach(a=>{a.currentTime=0;a.play()});paused=false;document.querySelector('#pause').textContent='暂停'};document.querySelector('#pause').onclick=()=>{paused=!paused;animations().forEach(a=>paused?a.pause():a.play());document.querySelector('#pause').textContent=paused?'继续':'暂停'};document.querySelector('#theme').onclick=()=>{light=!light;document.body.style.background=light?'#FAFAF4':'#211F1B';document.body.style.color=light?'#3F3A32':'#FAFAF4'};range.oninput=()=>{animations().forEach(a=>{a.pause();a.currentTime=+range.value});paused=true;document.querySelector('#pause').textContent='继续'};</script></html>
