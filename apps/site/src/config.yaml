site:
  name: MollyTime
  site: 'https://mollytime.app'
  base: '/'
  trailingSlash: false
metadata:
  title:
    default: MollyTime
    template: '%s｜MollyTime'
  description: '故事、科普、英语，孩子看的内容由你来选。MollyTime 连接家长手机与孩子的电视，支持整理视频、安排观看时间与电视续播。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: MollyTime
    images:
      - url: '~/assets/images/share.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image
i18n:
  language: zh-CN
  textDirection: ltr
apps:
  blog:
    isEnabled: false
    post:
      isEnabled: false
    list:
      isEnabled: false
      pathname: blog
    category:
      isEnabled: false
      pathname: category
    tag:
      isEnabled: false
      pathname: tag
analytics:
  vendors:
    googleAnalytics:
      id: null
ui:
  theme: 'system'
