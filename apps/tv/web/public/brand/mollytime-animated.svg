<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -48 352 352" role="img" aria-labelledby="motion-title"><title id="motion-title">MollyTime — 茉莉花飞旋与弹性 M</title><style>
.molly-m path { animation:molly-cradle 2800ms ease-in-out both; }
.molly-m { transform-origin:126px 213px; animation:molly-spring 2800ms both; }
.molly-flight { offset-path:path('M 0 0 C 55.2 -25.3 55.2 -110.4 9.2 -142.6 C 55.2 -110.4 55.2 -25.3 0 0'); offset-rotate:0deg; offset-anchor:0px 0px; offset-position:0px 0px; animation:molly-flight 2800ms both; }
.molly-carry { animation:molly-carry 2800ms both; }
.molly-spin { transform-origin:218px 190px; animation:molly-spin 2800ms both; }
@keyframes molly-cradle {
 0%,17% {d:path('M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V151C212 143 194 149 183 163V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z')}
 32% {d:path('M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V148C212 139 194 145 183 160V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z')}
 52%,72% {d:path('M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V151C212 143 194 149 183 163V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z')}
 76% {d:path('M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V153C212 145 194 151 183 165V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z')}
 88%,100% {d:path('M25 190V107C25 71 50.8 43 85 43C100.8 43 114.7 48.7 126 59.1C137.1 48.7 151.2 43 167 43C201.2 43 227 71 227 107V151C212 143 194 149 183 163V107C183 96.3 176.5 88 167 88C157.5 88 149 96.3 149 107V190C149 202.7 138.7 213 126 213C113.3 213 103 202.7 103 190V107C103 96.3 94.5 88 85 88C75.5 88 69 96.3 69 107V191C69 203.2 59.2 213 47 213C34.8 213 25 202.9 25 190Z')}
}
@keyframes molly-spring {
 0%,8% {transform:scale(1,1)}
 17% {transform:scale(1.03,.95);animation-timing-function:cubic-bezier(.2,.7,.25,1)}
 29% {transform:scale(.97,1.05);animation-timing-function:cubic-bezier(.3,0,.2,1)}
 43% {transform:scale(1.012,.985)}
 55% {transform:scale(.995,1.008)}
 63%,72% {transform:scale(1,1)}
 76% {transform:scale(1.018,.975)}
 88% {transform:scale(.992,1.012)}
 94%,100% {transform:scale(1,1)}
}
/* Local translations follow the flower centre under the M spring, without
   squashing the petals. The landing adds the cradle's two-unit give. */
@keyframes molly-carry {
 0%,8% {transform:translate(0px,0px)}
 17% {transform:translate(2.76px,1.15px);animation-timing-function:cubic-bezier(.2,.7,.25,1)}
 29%,72% {transform:translate(0px,0px)}
 76% {transform:translate(1.656px,2.575px)}
 88% {transform:translate(-.736px,-.276px)}
 94%,100% {transform:translate(0px,0px)}
}
@keyframes molly-flight {
 0%,17% {offset-distance:0%;animation-timing-function:cubic-bezier(.2,.65,.3,1)}
 45%,49% {offset-distance:50%;animation-timing-function:cubic-bezier(.5,0,.7,1)}
 72%,100% {offset-distance:100%}
}
@keyframes molly-spin {
 0%,17% {transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.65,.3,1)}
 45%,49% {transform:rotate(-360deg);animation-timing-function:cubic-bezier(.5,0,.7,1)}
 72%,100% {transform:rotate(-720deg)}
}
@media(prefers-reduced-motion:reduce) {.molly-m path,.molly-m,.molly-flight,.molly-carry,.molly-spin {animation:none!important;offset-path:none}}
