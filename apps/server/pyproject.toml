[project]
name = "mollytime-server"
version = "0.2.0"
description = "MollyTime Server — media catalog with own REST API for the MollyTime client"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "bcrypt==4.0.1",
  "pillow>=10.4",
  "httpx>=0.27",
  "oss2>=2.19,<3",          # Official Alibaba OSS SDK
  "aiofiles>=24.1",
  "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
mollytime-server = "mollytime_server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mollytime_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"
